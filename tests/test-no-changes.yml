name: Test no-changes plan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file with no changes
        run: |
          cat > /tmp/plan-nochange.txt << 'EOF'
          No changes. Your infrastructure matches the configuration.

          Terraform has compared your real infrastructure against your configuration
          and found no differences, so no changes are needed.
          EOF

      - name: Create terraform plan JSON file with no changes
        run: |
          cat > /tmp/plan-nochange.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {}
            },
            "resource_changes": [],
            "configuration": {
              "root_module": {}
            }
          }
          EOF

      - name: Run terraform report action with no-change plan
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          terraform-text: /tmp/plan-nochange.txt
          terraform-json: /tmp/plan-nochange.json
          show-diff: "false"
          show-plan: "true"

      - name: Assert action ran for no-change plan
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there is no pull request context under
          # workflow_dispatch, but it should not crash due to an empty plan.
          # We accept both success and failure (no PR = expected failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion for no-change plan (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
