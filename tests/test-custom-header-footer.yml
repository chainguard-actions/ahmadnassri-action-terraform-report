name: Test - Custom Header and Footer
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          mkdir -p /tmp/tf-test
          echo "Plan: 0 to add, 1 to change, 0 to destroy." > /tmp/tf-test/terraform.txt

      - name: Create terraform plan JSON file (with update action)
        run: |
          cat > /tmp/tf-test/terraform.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "resource_changes": [
              {
                "address": "module.network.aws_vpc.main",
                "change": {
                  "actions": ["update"],
                  "before": { "cidr_block": "10.0.0.0/16" },
                  "after": { "cidr_block": "10.1.0.0/16" }
                }
              }
            ]
          }
          EOF

      - name: Run action with custom header and footer
        id: action
        uses: .
        with:
          terraform-text: /tmp/tf-test/terraform.txt
          terraform-json: /tmp/tf-test/terraform.json
          custom-header: "## My Custom Terraform Report Header"
          custom-footer: "Generated by CI pipeline"
          show-header: "true"
          show-footer: "true"
        continue-on-error: true

      - name: Assert action exited gracefully (not a PR)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action exits early (exit 0) because there is no pull_request context
          # under workflow_dispatch. This verifies the action accepts custom-header
          # and custom-footer inputs without crashing.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted custom header/footer and exited gracefully"
          else
            echo "FAIL: expected success (graceful exit) but got: $OUTCOME"
            exit 1
          fi
