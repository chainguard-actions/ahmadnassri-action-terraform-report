name: Test hide comment when no terraform changes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file (no changes)
        run: |
          cat > /tmp/plan-noshow.txt << 'EOF'
          No changes. Your infrastructure matches the configuration.

          Terraform has compared your real infrastructure against your configuration
          and found no differences, so no changes are needed.
          EOF

      - name: Create terraform plan JSON file (no changes)
        run: |
          cat > /tmp/plan-noshow.json << 'EOF'
          {
            "format_version": "1.1",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {}
            },
            "resource_changes": [],
            "configuration": {
              "root_module": {}
            },
            "timestamp": "2024-01-01T00:00:00Z",
            "errored": false
          }
          EOF

      - name: Run action with show-no-changes disabled
        id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          terraform-text: /tmp/plan-noshow.txt
          terraform-json: /tmp/plan-noshow.json
          show-no-changes: "false"
          show-header: "true"
          show-footer: "true"
          show-plan: "true"
          show-diff: "false"
          remove-stale-reports: "false"
        continue-on-error: true

      - name: Assert action ran (completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there's no real GitHub PR context,
          # but it should not crash before reading the input files.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with show-no-changes=false (outcome: ${{ steps.action.outcome }})"
