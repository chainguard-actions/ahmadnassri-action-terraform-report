name: Test terraform report with custom options - diff view and custom header/footer
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/3/merge
      GITHUB_HEAD_REF: custom-options-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file with changes
        run: |
          mkdir -p /tmp/terraform-custom
          cat > /tmp/terraform-custom/plan.txt << 'EOF'
          Terraform used the selected providers to generate the following execution
          plan. Resource actions are indicated with the following symbols:
            ~ update in-place
            - destroy

          Terraform will perform the following actions:

            # aws_instance.web will be updated in-place
            ~ resource "aws_instance" "web" {
                  id            = "i-1234567890abcdef0"
                ~ instance_type = "t2.micro" -> "t3.small"
              }

            # aws_s3_bucket.old will be destroyed
            - resource "aws_s3_bucket" "old" {
                - bucket = "old-bucket" -> null
                - id     = "old-bucket" -> null
              }

          Plan: 0 to add, 1 to change, 1 to destroy.
          EOF

      - name: Create terraform plan JSON file with changes
        run: |
          cat > /tmp/terraform-custom/plan.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {
                "resources": [
                  {
                    "address": "aws_instance.web",
                    "mode": "managed",
                    "type": "aws_instance",
                    "name": "web",
                    "provider_name": "registry.terraform.io/hashicorp/aws",
                    "schema_version": 1,
                    "values": {
                      "instance_type": "t3.small"
                    }
                  }
                ]
              }
            },
            "resource_changes": [
              {
                "address": "aws_instance.web",
                "mode": "managed",
                "type": "aws_instance",
                "name": "web",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["update"],
                  "before": {
                    "instance_type": "t2.micro"
                  },
                  "after": {
                    "instance_type": "t3.small"
                  },
                  "after_unknown": {}
                }
              },
              {
                "address": "aws_s3_bucket.old",
                "mode": "managed",
                "type": "aws_s3_bucket",
                "name": "old",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["delete"],
                  "before": {
                    "bucket": "old-bucket",
                    "id": "old-bucket"
                  },
                  "after": null,
                  "after_unknown": {}
                }
              }
            ],
            "configuration": {
              "root_module": {}
            }
          }
          EOF

      - name: Run terraform report action with custom options
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: fake-token-for-testing
          terraform-text: /tmp/terraform-custom/plan.txt
          terraform-json: /tmp/terraform-custom/plan.json
          custom-header: "## My Custom Terraform Report Header"
          custom-footer: "Generated by CI pipeline"
          show-header: "true"
          show-footer: "true"
          show-plan: "false"
          show-diff: "true"
          remove-stale-reports: "false"

      - name: Assert action was invoked with custom options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action was invoked with outcome: ${{ steps.action.outcome }}"
