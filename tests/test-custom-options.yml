name: Test custom options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          cat > /tmp/plan.txt << 'EOF'
          Terraform used the selected providers to generate the following execution
          plan. Resource actions are indicated with the following symbols:
            ~ update in-place
            - destroy

          Terraform will perform the following actions:

            # aws_instance.web will be updated in-place
            ~ resource "aws_instance" "web" {
                ~ instance_type = "t2.micro" -> "t3.small"
                  id            = "i-1234567890abcdef0"
              }

            # aws_security_group.old will be destroyed
            - resource "aws_security_group" "old" {
                - id   = "sg-0123456789abcdef0" -> null
                - name = "old-sg" -> null
              }

          Plan: 0 to add, 1 to change, 1 to destroy.
          EOF

      - name: Create terraform plan JSON file
        run: |
          cat > /tmp/plan.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {
                "resources": [
                  {
                    "address": "aws_instance.web",
                    "mode": "managed",
                    "type": "aws_instance",
                    "name": "web",
                    "provider_name": "registry.terraform.io/hashicorp/aws",
                    "schema_version": 1,
                    "values": {
                      "instance_type": "t3.small"
                    }
                  }
                ]
              }
            },
            "resource_changes": [
              {
                "address": "aws_instance.web",
                "mode": "managed",
                "type": "aws_instance",
                "name": "web",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["update"],
                  "before": {
                    "instance_type": "t2.micro"
                  },
                  "after": {
                    "instance_type": "t3.small"
                  },
                  "after_unknown": {}
                }
              },
              {
                "address": "aws_security_group.old",
                "mode": "managed",
                "type": "aws_security_group",
                "name": "old",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["delete"],
                  "before": {
                    "id": "sg-0123456789abcdef0",
                    "name": "old-sg"
                  },
                  "after": null,
                  "after_unknown": {}
                }
              }
            ],
            "configuration": {
              "root_module": {}
            }
          }
          EOF

      - name: Run terraform report action with custom options
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          terraform-text: /tmp/plan.txt
          terraform-json: /tmp/plan.json
          show-diff: "true"
          show-plan: "true"
          remove-stale-reports: "false"
          custom-header: ":memo: Custom Terraform Report"

      - name: Assert action ran with custom options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there is no pull request context under
          # workflow_dispatch, but it should not crash due to invalid inputs.
          # We accept both success and failure (no PR = expected failure).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with custom options (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
