name: Test custom header and footer options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan fixtures
        run: |
          mkdir -p /tmp/tf-fixtures-custom
          cat > /tmp/tf-fixtures-custom/plan.txt << 'EOF'
          Terraform will perform the following actions:

            # aws_instance.example will be created
            + resource "aws_instance" "example" {
                + ami           = "ami-12345678"
                + instance_type = "t2.micro"
              }

          Plan: 1 to add, 0 to change, 0 to destroy.
          EOF

          cat > /tmp/tf-fixtures-custom/plan.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "resource_changes": [
              {
                "address": "aws_instance.example",
                "change": {
                  "actions": ["create"],
                  "before": null,
                  "after": {
                    "ami": "ami-12345678",
                    "instance_type": "t2.micro"
                  }
                }
              }
            ]
          }
          EOF

      - name: Run action with custom header and footer (expect graceful exit in non-PR context)
        id: action
        uses: .
        with:
          terraform-text: /tmp/tf-fixtures-custom/plan.txt
          terraform-json: /tmp/tf-fixtures-custom/plan.json
          custom-header: "### Custom Terraform Report Header"
          custom-footer: "Custom footer text"
          show-diff: "true"
          show-plan: "true"
          show-header: "true"
          show-footer: "true"
          remove-stale-reports: "false"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with custom options (graceful exit in non-PR context)"
          echo "PASS"
