name: Test custom header footer and diff options
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          cat > /tmp/plan-custom.txt << 'EOF'
          Terraform used the selected providers to generate the following execution
          plan. Resource actions are indicated with the following symbols:
            ~ update in-place
            - destroy

          Terraform will perform the following actions:

            # aws_instance.web will be updated in-place
            ~ resource "aws_instance" "web" {
                ~ instance_type = "t2.micro" -> "t3.small"
                  id            = "i-1234567890abcdef0"
              }

            # aws_security_group.old will be destroyed
            - resource "aws_security_group" "old" {
                - id   = "sg-12345" -> null
                - name = "old-sg"   -> null
              }

          Plan: 0 to add, 1 to change, 1 to destroy.
          EOF

      - name: Create terraform plan JSON file
        run: |
          cat > /tmp/plan-custom.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {
                "resources": [
                  {
                    "address": "aws_instance.web",
                    "mode": "managed",
                    "type": "aws_instance",
                    "name": "web",
                    "provider_name": "registry.terraform.io/hashicorp/aws",
                    "schema_version": 0,
                    "values": {
                      "instance_type": "t3.small",
                      "id": "i-1234567890abcdef0"
                    }
                  }
                ]
              }
            },
            "resource_changes": [
              {
                "address": "aws_instance.web",
                "mode": "managed",
                "type": "aws_instance",
                "name": "web",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["update"],
                  "before": {
                    "instance_type": "t2.micro",
                    "id": "i-1234567890abcdef0"
                  },
                  "after": {
                    "instance_type": "t3.small",
                    "id": "i-1234567890abcdef0"
                  },
                  "after_unknown": {}
                }
              },
              {
                "address": "aws_security_group.old",
                "mode": "managed",
                "type": "aws_security_group",
                "name": "old",
                "provider_name": "registry.terraform.io/hashicorp/aws",
                "change": {
                  "actions": ["delete"],
                  "before": {
                    "id": "sg-12345",
                    "name": "old-sg"
                  },
                  "after": null,
                  "after_unknown": {}
                }
              }
            ],
            "configuration": {
              "root_module": {}
            }
          }
          EOF

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          terraform-text: /tmp/plan-custom.txt
          terraform-json: /tmp/plan-custom.json
          custom-header: "## My Custom Terraform Report Header"
          custom-footer: "Generated by CI pipeline"
          show-header: "true"
          show-footer: "true"
          show-plan: "true"
          show-diff: "true"
          remove-stale-reports: "false"
          show-no-changes: "true"

      - name: Assert action completed successfully with custom options
        run: |
          echo "Action completed without error with custom header/footer and diff enabled"
          echo "PASS"
