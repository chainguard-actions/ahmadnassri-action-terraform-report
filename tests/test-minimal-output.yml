name: Test terraform report with all display options disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/4/merge
      GITHUB_HEAD_REF: minimal-output-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          mkdir -p /tmp/terraform-minimal
          cat > /tmp/terraform-minimal/plan.txt << 'EOF'
          Terraform used the selected providers to generate the following execution
          plan. Resource actions are indicated with the following symbols:
            + create

          Terraform will perform the following actions:

            # null_resource.example will be created
            + resource "null_resource" "example" {
                + id = (known after apply)
              }

          Plan: 1 to add, 0 to change, 0 to destroy.
          EOF

      - name: Create terraform plan JSON file
        run: |
          cat > /tmp/terraform-minimal/plan.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "variables": {},
            "planned_values": {
              "root_module": {
                "resources": [
                  {
                    "address": "null_resource.example",
                    "mode": "managed",
                    "type": "null_resource",
                    "name": "example",
                    "provider_name": "registry.terraform.io/hashicorp/null",
                    "schema_version": 0,
                    "values": {
                      "id": null
                    }
                  }
                ]
              }
            },
            "resource_changes": [
              {
                "address": "null_resource.example",
                "mode": "managed",
                "type": "null_resource",
                "name": "example",
                "provider_name": "registry.terraform.io/hashicorp/null",
                "change": {
                  "actions": ["create"],
                  "before": null,
                  "after": {},
                  "after_unknown": {
                    "id": true
                  }
                }
              }
            ],
            "configuration": {
              "root_module": {}
            }
          }
          EOF

      - name: Run terraform report action with all display options disabled
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: fake-token-for-testing
          terraform-text: /tmp/terraform-minimal/plan.txt
          terraform-json: /tmp/terraform-minimal/plan.json
          show-header: "false"
          show-footer: "false"
          show-plan: "false"
          show-diff: "false"
          remove-stale-reports: "false"

      - name: Assert action was invoked with minimal output options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action was invoked with outcome: ${{ steps.action.outcome }}"
