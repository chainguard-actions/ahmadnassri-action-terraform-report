name: Test - No Changes Terraform Plan
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          mkdir -p /tmp/tf-test
          echo "No changes. Your infrastructure matches the configuration." > /tmp/tf-test/terraform.txt

      - name: Create terraform plan JSON file (no changes - all no-op)
        run: |
          cat > /tmp/tf-test/terraform.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "resource_changes": [
              {
                "address": "module.foo.bar",
                "change": {
                  "actions": ["no-op"],
                  "before": { "foo": "bar" },
                  "after": { "foo": "bar" }
                }
              }
            ]
          }
          EOF

      - name: Run action with show-no-changes false (no PR context)
        id: action
        uses: .
        with:
          terraform-text: /tmp/tf-test/terraform.txt
          terraform-json: /tmp/tf-test/terraform.json
          show-no-changes: "false"
        continue-on-error: true

      - name: Assert action exited gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action exits early (exit 0) because there is no pull_request context
          # under workflow_dispatch. This is the expected graceful behavior.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully with no-changes plan and no PR context"
          else
            echo "FAIL: expected success (graceful exit) but got: $OUTCOME"
            exit 1
          fi
