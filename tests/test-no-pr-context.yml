name: Test - No PR Context (graceful exit)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan text file
        run: |
          mkdir -p /tmp/tf-test
          echo "foobar" > /tmp/tf-test/terraform.txt

      - name: Create terraform plan JSON file (with changes)
        run: |
          cat > /tmp/tf-test/terraform.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "resource_changes": [
              {
                "address": "module.foo.bar",
                "change": {
                  "actions": ["update"],
                  "before": { "foo": "bar" },
                  "after": { "foo": "baz" }
                }
              }
            ]
          }
          EOF

      - name: Run action (expect graceful exit - not a PR)
        id: action
        uses: .
        with:
          terraform-text: /tmp/tf-test/terraform.txt
          terraform-json: /tmp/tf-test/terraform.json
        continue-on-error: true

      - name: Assert action exited gracefully (not a PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should succeed (exit 0) with a warning about not being a PR
          # Under workflow_dispatch there is no pull_request context, so the action
          # exits early with a warning (process.exit(0))
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited gracefully when not in PR context"
          else
            echo "FAIL: expected success (graceful exit) but got: $OUTCOME"
            exit 1
          fi
