name: Test basic usage (non-PR context)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create terraform plan fixtures
        run: |
          mkdir -p /tmp/tf-fixtures
          cat > /tmp/tf-fixtures/plan.txt << 'EOF'
          Terraform will perform the following actions:

            # module.foo.baz will be updated in-place
            ~ resource "foo" "baz" {
                ~ foo = "bar" -> "baz"
              }

          Plan: 0 to add, 1 to change, 0 to destroy.
          EOF

          cat > /tmp/tf-fixtures/plan.json << 'EOF'
          {
            "format_version": "1.0",
            "terraform_version": "1.5.0",
            "resource_changes": [
              {
                "address": "module.foo.baz",
                "change": {
                  "actions": ["update"],
                  "before": {
                    "foo": "bar"
                  },
                  "after": {
                    "foo": "baz"
                  }
                }
              }
            ]
          }
          EOF

      - name: Run action (expect graceful exit in non-PR context)
        id: action
        uses: .
        with:
          terraform-text: /tmp/tf-fixtures/plan.txt
          terraform-json: /tmp/tf-fixtures/plan.json

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (graceful exit in non-PR context)"
          echo "PASS"
