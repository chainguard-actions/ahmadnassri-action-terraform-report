name: Test - Missing Required Inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing terraform-json input
        id: action-missing-json
        uses: .
        with:
          terraform-text: /tmp/nonexistent/terraform.txt
          terraform-json: ""
        continue-on-error: true

      - name: Assert action failed with missing inputs
        env:
          OUTCOME: ${{ steps.action-missing-json.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (exit 1) when required inputs are missing
          # context.js checks: if (!inputs.textPath || !inputs.jsonPath || !inputs.token)
          # and calls process.exit(1)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when required inputs are missing"
          else
            echo "FAIL: expected failure when required inputs are missing, got: $OUTCOME"
            exit 1
          fi
